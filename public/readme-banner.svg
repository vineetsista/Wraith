<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wraith — see the spread before anyone else">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00FF88" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="320" fill="url(#glow)" opacity="0.7"/>

  <!-- Top + bottom scan lines -->
  <rect x="0" y="0" width="1280" height="1.5" fill="url(#line)"/>
  <rect x="0" y="318.5" width="1280" height="1.5" fill="url(#line)"/>

  <!-- Logo lockup left -->
  <g transform="translate(80 110)">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#0C0C10" stroke="#00FF88" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M28 12L40 26H34L37 50H19L22 26H16L28 12Z" fill="#00FF88" fill-opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="160" font-family="Georgia, 'Instrument Serif', serif" font-size="84" fill="#EAEAEF" letter-spacing="-2">Wraith</text>
  <text x="160" y="200" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" fill="#00FF88" letter-spacing="2">SEE THE SPREAD BEFORE ANYONE ELSE.</text>
  <text x="160" y="234" font-family="system-ui, 'Satoshi', sans-serif" font-size="16" fill="#6B6B7B">AI arbitrage intelligence for sneakers, streetwear, and collectibles.</text>

  <!-- Right-side stat tiles -->
  <g transform="translate(820 70)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#0C0C10" stroke="rgba(0,255,136,0.25)"/>
    <text x="16" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" fill="#3A3A48" letter-spacing="1.5">NET PROFIT</text>
    <text x="16" y="62" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="32" fill="#00FF88" font-weight="700">+$41</text>
  </g>
  <g transform="translate(1015 70)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#0C0C10" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" fill="#3A3A48" letter-spacing="1.5">CONFIDENCE</text>
    <text x="16" y="62" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="32" fill="#EAEAEF" font-weight="700">94<tspan font-size="14" fill="#6B6B7B">%</tspan></text>
  </g>

  <g transform="translate(820 170)">
    <rect x="0" y="0" width="375" height="80" rx="8" fill="#0C0C10" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" fill="#3A3A48" letter-spacing="1.5">JORDAN 4 BRED REIMAGINED</text>
    <text x="16" y="58" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" fill="#EAEAEF">MERCARI <tspan fill="#3A3A48">→</tspan> STOCKX</text>
    <circle cx="345" cy="55" r="6" fill="#00FF88"/>
    <circle cx="345" cy="55" r="11" fill="none" stroke="#00FF88" stroke-opacity="0.35"/>
  </g>
</svg>
