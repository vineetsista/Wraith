<svg width="640" height="280" viewBox="0 0 640 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signal card preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="280">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="120" y2="280">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="600" height="240" rx="10" fill="#0C0C10" stroke="rgba(0,255,136,0.3)"/>
  <rect x="20" y="20" width="600" height="1.2" fill="#00FF88" fill-opacity="0.8"/>

  <!-- Image area -->
  <rect x="20" y="21" width="120" height="238" fill="url(#thumb)"/>
  <text x="80" y="248" font-family="ui-monospace, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle" letter-spacing="2">SNEA</text>

  <!-- Badges -->
  <rect x="160" y="40" width="50" height="20" rx="3" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.3)"/>
  <text x="185" y="54" font-family="ui-monospace, monospace" font-size="10" fill="#00FF88" text-anchor="middle" letter-spacing="1">ARB</text>
  <rect x="218" y="40" width="80" height="20" rx="3" fill="rgba(255,61,87,0.1)" stroke="rgba(255,61,87,0.3)"/>
  <text x="258" y="54" font-family="ui-monospace, monospace" font-size="10" fill="#FF3D57" text-anchor="middle" letter-spacing="1">ACT NOW</text>

  <!-- Title -->
  <text x="160" y="86" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#EAEAEF">Jordan 4 Bred Reimagined</text>
  <text x="160" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#3A3A48">Jordan · SZ 10 · 2h ago</text>

  <!-- Buy / Sell -->
  <rect x="160" y="120" width="138" height="34" rx="4" fill="#141418" stroke="rgba(255,255,255,0.06)"/>
  <text x="170" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#3A3A48">BUY</text>
  <text x="195" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#FF4F00">MERCARI</text>
  <text x="170" y="151" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#EAEAEF">$198</text>

  <text x="308" y="142" font-family="ui-monospace, monospace" font-size="14" fill="#3A3A48">→</text>

  <rect x="322" y="120" width="138" height="34" rx="4" fill="#141418" stroke="rgba(255,255,255,0.06)"/>
  <text x="332" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#3A3A48">SELL</text>
  <text x="357" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#00FF00">STOCKX</text>
  <text x="332" y="151" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#EAEAEF">$267</text>

  <!-- AI line -->
  <text x="160" y="180" font-family="ui-monospace, monospace" font-size="10" fill="#3A3A48" letter-spacing="1">AI ANALYSIS</text>
  <text x="160" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#6B6B7B">Priced 27% below market avg. Social volume</text>
  <text x="160" y="216" font-family="system-ui, sans-serif" font-size="11" fill="#6B6B7B">spiked 340% this week. 4–6h sell-through.</text>

  <!-- Confidence gauge (stylized) -->
  <g transform="translate(530 70)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="5"/>
    <path d="M 17.2 62.8 A 34 34 0 1 1 62.8 62.8" stroke="#00FF88" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="160 250"/>
    <text x="40" y="42" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#EAEAEF" text-anchor="middle">94</text>
    <text x="40" y="56" font-family="ui-monospace, monospace" font-size="8" fill="#3A3A48" text-anchor="middle" letter-spacing="1">CONF</text>
  </g>

  <!-- Profit -->
  <text x="565" y="200" font-family="ui-monospace, monospace" font-size="10" fill="#3A3A48" text-anchor="end" letter-spacing="1">NET PROFIT</text>
  <text x="600" y="232" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#00FF88" text-anchor="end">+$41</text>
</svg>
